<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<title>Small Island</title>
<meta name="description" content="A slow, soft dating app set in Singapore. Swipe, match, and just talk." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; background: #140E26; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #root { height: 100%; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #F7EDE1; font-family: Karla, system-ui, sans-serif; font-size: 14px; letter-spacing: .06em;
    background: linear-gradient(180deg, #140E26, #2C1B44);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">the island is waking up…</div>
<script src="app.js"></script>
<script>
  var boot = document.getElementById("boot");
  if (boot) boot.remove();
</script>
</body>
</html>
