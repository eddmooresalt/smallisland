<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<title>Small Island</title>
<meta name="description" content="A slow, soft dating app set in Singapore. Swipe, match, and just talk." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; background: #140E26; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #root { height: 100%; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #F7EDE1; font-family: Karla, system-ui, sans-serif; font-size: 14px; letter-spacing: .06em;
    background: linear-gradient(180deg, #140E26, #2C1B44);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">the island is waking up…</div>
<script>
/* Small Island Puter bridge — non-blocking build.
   The game UI starts immediately. Puter.js is loaded only when an AI reply is needed. */
(function () {
  var SLOT = "smallisland:provider-config";
  var MODEL = "openai/gpt-5.6-sol";
  try {
    var cfg = {};
    try { cfg = JSON.parse(localStorage.getItem(SLOT) || "{}"); } catch (_) {}
    cfg.provider = "openai";
    cfg.openaiKey = "puter-user-pays";
    cfg.openaiBase = "https://api.openai.com/v1/chat/completions";
    cfg.openaiModel = MODEL;
    localStorage.setItem(SLOT, JSON.stringify(cfg));
  } catch (_) {}

  var realFetch = window.fetch.bind(window);
  var puterPromise = null;

  function ensurePuter() {
    if (window.puter && puter.ai && puter.ai.chat) return Promise.resolve(window.puter);
    if (puterPromise) return puterPromise;
    puterPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error('Puter.js took too long to load'));
      }, 15000);
      s.src = 'https://js.puter.com/v2/';
      s.async = true;
      s.onload = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (window.puter && puter.ai && puter.ai.chat) resolve(window.puter);
        else reject(new Error('Puter.js loaded but AI was unavailable'));
      };
      s.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error('Could not load Puter.js'));
      };
      document.head.appendChild(s);
    });
    return puterPromise;
  }

  function asText(content) {
    if (typeof content === "string") return content;
    if (!Array.isArray(content)) return "";
    return content.map(function (part) {
      if (!part) return "";
      return part.type === "text" ? (part.text || "") : "";
    }).join("\n");
  }

  function getImages(content) {
    if (!Array.isArray(content)) return [];
    return content.map(function (part) {
      return part && part.type === "image_url" && part.image_url ? part.image_url.url : null;
    }).filter(Boolean);
  }

  function responseText(r) {
    if (!r) return "";
    if (typeof r === "string") return r;
    if (r.message && typeof r.message.content === "string") return r.message.content;
    if (r.message && Array.isArray(r.message.content)) {
      return r.message.content.map(function (p) {
        return typeof p === "string" ? p : (p && (p.text || p.content)) || "";
      }).join("");
    }
    if (typeof r.text === "string") return r.text;
    return "";
  }

  window.fetch = async function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("api.openai.com/v1/chat/completions") !== -1) {
      try {
        await ensurePuter();
        var body = JSON.parse((init && init.body) || "{}");
        var incoming = body.messages || [];
        var messages = incoming.map(function (m) {
          return { role: m.role, content: asText(m.content) };
        });
        var images = [];
        incoming.forEach(function (m) { images = images.concat(getImages(m.content)); });

        var result;
        if (images.length) {
          var prompt = messages.map(function (m) {
            return String(m.role || "user").toUpperCase() + ":\n" + (m.content || "");
          }).join("\n\n") + "\n\nASSISTANT:\nReply now. Output only the requested message text.";
          result = await puter.ai.chat(prompt, images.length === 1 ? images[0] : images, {
            model: MODEL,
            max_tokens: body.max_tokens || 1000
          });
        } else {
          result = await puter.ai.chat(messages, {
            model: MODEL,
            max_tokens: body.max_tokens || 1000
          });
        }
        var text = responseText(result).trim();
        if (!text) throw new Error("Empty Puter response");
        return new Response(JSON.stringify({ choices: [{ message: { role: "assistant", content: text } }] }), {
          status: 200,
          headers: { "Content-Type": "application/json" }
        });
      } catch (err) {
        console.error("Small Island Puter bridge:", err);
        return new Response(JSON.stringify({ error: { message: String(err && (err.msg || err.message) || err) } }), {
          status: 502,
          headers: { "Content-Type": "application/json" }
        });
      }
    }
    return realFetch(input, init);
  };

  /* Patch the old provider panel only after ordinary user clicks instead of
     observing every DOM mutation in the whole app. */
  function patchPanel() {
    document.querySelectorAll('.keybox').forEach(function (box) {
      var eyebrow = box.querySelector('.eyebrow');
      if (!eyebrow || eyebrow.textContent.trim().toLowerCase() !== 'how they reply') return;
      box.classList.add('puterbox');
      var live = box.querySelector('.livenote');
      if (live) {
        live.classList.add('on');
        live.textContent = '● Live — OpenAI via Puter.js. No API key needed.';
      }
      if (!box.querySelector('.puter-note')) {
        var note = document.createElement('p');
        note.className = 'fine puter-note';
        note.textContent = 'First AI reply may ask you to sign in to Puter. Model: ' + MODEL;
        box.appendChild(note);
      }
    });
  }
  document.addEventListener('click', function () { setTimeout(patchPanel, 0); }, true);
  document.addEventListener('DOMContentLoaded', function () { setTimeout(patchPanel, 0); });
})();
</script>
<style>
.puterbox .providerrow,
.puterbox .namefield.mono,
.puterbox .fieldlabel,
.puterbox .fine.warn,
.puterbox .keyrow { display:none !important; }
</style>
<script src="app.js"></script>
<script>
  var boot = document.getElementById("boot");
  if (boot) boot.remove();
</script>

<!-- Mobile keyboard / visual viewport fix -->
<style>
  /* The Android keyboard can pan the visual viewport inside itch's iframe.
     Anchor the chat room to the ACTUAL visible viewport, not the layout viewport. */
  .room{
    top:var(--vvtop, 0px) !important;
    height:var(--vvh, 100dvh) !important;
    overflow:hidden !important;
  }
  .scroll{
    min-height:0 !important;
    overscroll-behavior:contain;
  }
  .composer{
    padding-bottom:max(10px, env(safe-area-inset-bottom)) !important;
  }
</style>
<script>
(function () {
  var root = document.documentElement;

  function syncVisibleViewport() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var top = vv ? vv.offsetTop : 0;

    root.style.setProperty("--vvh", Math.max(1, Math.round(h)) + "px");
    root.style.setProperty("--vvtop", Math.max(0, Math.round(top)) + "px");
  }

  syncVisibleViewport();

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncVisibleViewport, { passive:true });
    window.visualViewport.addEventListener("scroll", syncVisibleViewport, { passive:true });
  }
  window.addEventListener("resize", syncVisibleViewport, { passive:true });
  window.addEventListener("orientationchange", function () {
    setTimeout(syncVisibleViewport, 50);
    setTimeout(syncVisibleViewport, 300);
  });

  /* Samsung/Chrome can report the final keyboard geometry a beat after focus. */
  document.addEventListener("focusin", function (e) {
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) {
      setTimeout(syncVisibleViewport, 0);
      setTimeout(syncVisibleViewport, 80);
      setTimeout(syncVisibleViewport, 260);
    }
  }, true);

  document.addEventListener("focusout", function () {
    setTimeout(syncVisibleViewport, 0);
    setTimeout(syncVisibleViewport, 180);
  }, true);
})();
</script>

</body>
</html>
